<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Chat · magdielAI</title>
  <meta name="description" content="Chat con voz e imágenes usando MiniMax-M3" />
  <meta name="theme-color" content="#d62976" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="magdielAI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="profile">
        <div class="ring">
          <div class="avatar">AI</div>
        </div>
        <div class="meta">
          <div class="name">magdielAI</div>
          <div class="status" id="status"><span class="dot"></span>Activo ahora</div>
        </div>
      </div>
      <div class="actions">
        <button id="callBtn" class="icon-btn ghost" aria-label="Llamar" title="Iniciar llamada por voz">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="previewBar" class="preview-bar" hidden>
      <div id="previews" class="previews"></div>
      <button id="clearPreviews" class="icon-btn ghost small" aria-label="Quitar" title="Quitar">×</button>
    </div>

    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="addBtn" class="icon-btn" aria-label="Adjuntar imagen" title="Adjuntar imagen">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
      </button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
      <textarea id="input" class="input" rows="1" placeholder="Mensaje..." aria-label="Mensaje"></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Enviar" title="Enviar" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </form>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('SW fail:', err));
      });
    }
  </script>
</body>
</html>
